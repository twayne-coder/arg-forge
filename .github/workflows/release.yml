name: Release

on:
  push:
    tags:
      - 'v*' # 匹配 v1.0.0, v2.1.0-alpha 等

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          # - os: macos-latest
          #   target: aarch64-apple-darwin
          # - os: ubuntu-22.04
          #   target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # - name: Build frontend  # tauri.conf.json 里已经写了 beforeBuildCommand: "pnpm build"
      #   run: pnpm build # tauri-action 会自动运行它

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # 使用触发 workflow 的 tag 名
          releaseName: "App Release ${{ github.ref_name }}"
          releaseBody: "See the assets below to download."
          releaseDraft: true # 建议先设为草稿，检查没问题后再手动发布
          prerelease: false
          args: --target ${{ matrix.platform.target }}
